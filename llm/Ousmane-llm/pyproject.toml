[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ousmane-llm"
version = "0.1.0"
description = "Local AutoAgent-orchestrated email security classifier"
requires-python = ">=3.11"
dependencies = [
  "autoagent-core==0.21.0",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
]

[project.scripts]
ousmane-llm = "ousmane_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ousmane_llm = ["py.typed", "prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a real local Ollama model"]
addopts = "-ra"
