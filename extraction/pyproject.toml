[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "email-security-pipeline"
version = "0.1.0"
description = "Local email ingestion and normalization pipeline"
requires-python = ">=3.11"
dependencies = [
  "aiosmtpd>=1.4.6,<2",
  "beautifulsoup4>=4.12,<5",
  "langdetect>=1.0.9,<2",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<12",
  "pydantic>=2.7,<3",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "python-magic>=0.4.27,<1",
  "python-pptx>=1.0,<2",
  "pytesseract>=0.3.13,<1",
  "pyzbar>=0.1.9,<1",
  "qrcode>=8,<9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
